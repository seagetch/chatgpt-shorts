name: Restore JPEG covers and regenerate reader
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-jpeg-covers.yml'
      - 'scripts/restore_jpeg_covers.py'
      - '20261103-*/title.svg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image rendering
        run: python -m pip install --disable-pip-version-check cairosvg pillow
      - name: Convert SVG covers to JPEG and regenerate catalog
        run: |
          python scripts/restore_jpeg_covers.py
          python -m py_compile generate_reader.py scripts/check_site.py
          python generate_reader.py
          python scripts/check_site.py
      - name: Commit and push JPEG publishing assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '20261103-'*/title.jpg '20261103-'*/index.html cover-versions.json index.html
          if git diff --cached --quiet; then
            echo 'JPEG assets already present and catalog up to date'
            exit 0
          fi
          git commit -m 'Restore JPEG covers for November 3 shorts'
          git push origin HEAD:main
